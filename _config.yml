# Hexo 站点主配置
# 官方文档：https://hexo.io/zh-cn/docs/configuration
# 改完任何配置都要重新执行 npm run build 才会生效

# ==================== 站点基本信息 ====================
title: 我的博客
subtitle: 记录学习与生活
description: 一个用 Hexo 搭建的个人博客
keywords: 博客,技术,生活
author: 你的昵称
language: zh-CN
timezone: Asia/Shanghai

# ==================== 网址设置 ====================
# 已按 luosen-sen / blog 配置好
# 如果仓库名不叫 blog，把下面的 /blog/ 改成你的仓库名（前后都要有斜杠）
url: https://luosen-sen.github.io
root: /blog/

# 文章链接格式：/2026/10/01/文章标题/
permalink: :year/:month/:day/:title/
permalink_defaults:
  trailing_index: false

# ==================== 目录与主题 ====================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:

# 使用的主题（butterfly 通过 npm 安装，不用手动下载）
theme: butterfly

# ==================== 文章与页面 ====================
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  auto_detect: false
  line_number: true
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ==================== 首页、归档、分类、标签 ====================
index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  enabled: true
  per_page: 20
  yearly: true
  monthly: false
  daily: false
  order_by: -date

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

# ==================== 日期格式 ====================
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ==================== 分页 ====================
per_page: 10
pagination_dir: page

# ==================== 部署（可选：直接 hexo deploy 部署到 GitHub Pages） ====================
# 推荐用 GitHub Actions 自动部署（仓库里已配好 .github/workflows/deploy.yml）
# 如果你想在本地手动推送，取消下面注释并改成你自己的仓库地址：
# deploy:
#   type: git
#   repo: https://github.com/luosen-sen/blog.git
#   branch: gh-pages
#   message: Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}

# ==================== 搜索（Butterfly 本地搜索） ====================
search:
  path: search.xml
  field: post
  content: true
  format: html

# ==================== Sitemap ====================
sitemap:
  path: sitemap.xml
